name: CI - 백엔드 API 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  MANIFEST_REPO: Cloud-Infra-Education/Manifests

jobs:
  build-push-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check backend-api repo
        id: check-backend
        continue-on-error: true
        run: aws ecr describe-repositories --repository-names backend-api > /dev/null 2>&1 && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Build (backend-api)
        if: steps.check-backend.outputs.exists == 'true'
        run: docker build -t ${ECR_REGISTRY}/backend-api:${IMAGE_TAG} .

      - name: Trivy Scan (backend-api)
        if: steps.check-backend.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/backend-api:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
        continue-on-error: true

      - name: Delete existing latest tag if exists
        if: steps.check-backend.outputs.exists == 'true'
        continue-on-error: true
        run: aws ecr batch-delete-image --repository-name backend-api --image-ids imageTag=latest --region ${AWS_REGION} || echo "No latest tag to delete"

      - name: Build latest tag
        if: steps.check-backend.outputs.exists == 'true'
        run: docker tag ${ECR_REGISTRY}/backend-api:${IMAGE_TAG} ${ECR_REGISTRY}/backend-api:latest

      - name: Push (backend-api)
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          docker push ${ECR_REGISTRY}/backend-api:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/backend-api:latest

      - name: Update Manifest Repository (backend-api)
        if: steps.check-backend.outputs.exists == 'true'
        env:
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          # Manifest Repo 클론
          git clone https://${MANIFEST_TOKEN}@github.com/${{ env.MANIFEST_REPO }}.git
          cd Manifests
          
          # Git 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 브랜치 자동 감지 및 체크아웃
          # 현재 Backend 브랜치 이름을 기반으로 Manifests 브랜치 찾기
          BACKEND_BRANCH="${{ github.ref_name }}"
          
          # 원격 브랜치 정보 가져오기
          git fetch origin
          
          # 브랜치 이름 매핑 (Backend 브랜치 → Manifests 브랜치)
          # 기본값: 현재 브랜치 이름 그대로 사용
          MANIFEST_BRANCH="${BACKEND_BRANCH}"
          
          # 브랜치 존재 여부 확인 및 체크아웃
          if git show-ref --verify --quiet refs/remotes/origin/${MANIFEST_BRANCH}; then
            # 원격 브랜치가 있으면 체크아웃
            git checkout -b ${MANIFEST_BRANCH} origin/${MANIFEST_BRANCH} || git checkout ${MANIFEST_BRANCH}
          elif git show-ref --verify --quiet refs/heads/${MANIFEST_BRANCH}; then
            # 로컬 브랜치가 있으면 체크아웃
            git checkout ${MANIFEST_BRANCH}
          else
            # 브랜치가 없으면 기본 브랜치 사용 (main 또는 기본 브랜치)
            DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo "main")
            echo "브랜치 ${MANIFEST_BRANCH}를 찾을 수 없어 기본 브랜치 ${DEFAULT_BRANCH}를 사용합니다."
            git checkout ${DEFAULT_BRANCH} || git checkout main || git checkout master
          fi
          
          # 최종 브랜치 확인
          FINAL_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "체크아웃된 브랜치: ${FINAL_BRANCH}"
          
          # latest 태그 사용 시에도 ArgoCD가 배포하도록 Git 커밋 생성
          # seoul/kustomization.yaml에 주석 추가 (항상 변경되도록)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if grep -q "# Last updated:" seoul/kustomization.yaml; then
            sed -i "s|# Last updated:.*|# Last updated: ${TIMESTAMP} (${IMAGE_TAG})|g" seoul/kustomization.yaml
          else
            sed -i "1a# Last updated: ${TIMESTAMP} (${IMAGE_TAG})" seoul/kustomization.yaml
          fi
          
          # 변경사항 커밋 & 푸시
          git add seoul/kustomization.yaml
          git commit -m "Auto-update: backend-api latest image (${IMAGE_TAG})" || echo "No changes to commit"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          # 현재 체크아웃된 브랜치로 자동 푸시
          git push origin ${CURRENT_BRANCH}


